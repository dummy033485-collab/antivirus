name: Build SafeShield APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The wrapper jar is a binary that is not committed to this repo.
      # Generating it here keeps ./gradlew working for every later step
      # and produces a jar we can hand back to developers as an artifact.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --no-daemon

      - name: Run unit tests
        id: tests
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          SAFE_BROWSING_API_KEY: ${{ secrets.SAFE_BROWSING_API_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          set -o pipefail
          ./gradlew test --no-daemon --stacktrace 2>&1 | tee -a build-output.log

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build debug APK
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          SAFE_BROWSING_API_KEY: ${{ secrets.SAFE_BROWSING_API_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee -a build-output.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeShield-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Gradle wrapper jar
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: gradle/wrapper/gradle-wrapper.jar
          retention-days: 30
          if-no-files-found: ignore

      # The agent sandbox cannot reach GitHub's log-storage host, so on failure we
      # mirror the compiler output into an issue, which IS readable over the API.
      # The agent sandbox cannot reach GitHub's log-storage host, so on failure we
      # mirror the compiler output into a commit comment, readable over api.github.com.
      - name: Report failure details
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo '```text'
            grep -aE "^e: |error:|FAILURE:|Unresolved reference|Caused by:|FAILED" build-output.log | head -c 40000
            echo '```'
            echo ""
            echo '```text'
            tail -n 120 build-output.log | head -c 20000
            echo '```'
          } > failure.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat failure.md)" >/dev/null && echo "commit comment posted"

      - name: Upload raw build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build-output.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "### SafeShield build"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| APK artifact | **SafeShield-debug-apk** (see Artifacts below) |"
            echo ""
            echo "Download the artifact, unzip it, and sideload \`app-debug.apk\` onto an Android 8.0+ device."
          } >> "$GITHUB_STEP_SUMMARY"
